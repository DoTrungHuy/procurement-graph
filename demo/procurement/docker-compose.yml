services:
  api:
    build: ./backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      MODEL_NETWORK_ENABLED: ${MODEL_NETWORK_ENABLED:-false}
      MODEL_PROFILE_PATH: /app/config/model-profile.local.json
      MODEL_SETTINGS_PATH: /app/data/model-settings.local.json
      EXTRACTION_STRATEGY: ${EXTRACTION_STRATEGY:-schema}
      RELATION_BACKEND: ${RELATION_BACKEND:-sqlite}
      DATABASE_PATH: /app/data/entity_mining.db
      UPLOAD_DIR: /app/data/uploads
      MODEL_DOCUMENT_CACHE_DIR: /app/data/.cache/document-extractions
      DEMO_SEED: ${DEMO_SEED:-false}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      MODEL_CONCURRENCY: ${MODEL_CONCURRENCY:-2}
      EXTRACT_BLANK_TEMPLATES: ${EXTRACT_BLANK_TEMPLATES:-true}
      EXTRACT_STANDARD_TABLES: ${EXTRACT_STANDARD_TABLES:-true}
      EXTRACT_BATCH_ATTACHMENTS: ${EXTRACT_BATCH_ATTACHMENTS:-false}
      OFFICIAL_DATA_DIR: /app/official
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ../../data/official-benchmark:/app/official:ro
      - ../../config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    cpus: 2
    mem_limit: 4g
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:80"

